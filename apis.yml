aid: airspace-technologies
name: Airspace Technologies
description: >-
  Airspace Technologies is a time-critical logistics provider that uses AI-driven routing
  to move urgent, high-value freight via Next Flight Out (NFO), on-demand ground, charter,
  and specialty services across 80+ countries. Its public REST API (current V3, prior V2)
  supports order creation, quote generation, and active shipment monitoring. The API is
  asynchronous, authenticates with a non-expiring bearer token, paginates lists with
  page/page_limit, and pushes milestone, delay, and cancellation updates over webhooks
  correlated by request_id.
