idempotency:
  supported: false
  note: >-
    The V3 API is asynchronous and does not document a client idempotency-key header.
    Request/response correlation is handled instead via a server-issued request_id
    (see request_tracing below); webhooks echo the same request_id.
pagination:
  style: page-number
  params:
  - name: page
    in: query
    description: 1-based page index for list endpoints (orders, invoices, address_books, events).
  - name: page_limit
    in: query
    description: Number of records per page.
async_model:
  description: >-
    Most write requests return 202 Accepted with a message acknowledging receipt; the
    order is then processed asynchronously and progress is delivered via webhooks and
    the /orders/events polling endpoints. Successful reads return 200.
request_tracing:
  field: request_id
  location: response body and webhook payloads
  description: >-
    A UUID returned in the initial API response and echoed on every webhook notification;
    use it to correlate asynchronous webhook events with the originating request.
versioning:
  scheme: uri-path
  current: v3
  prior: v2
  detail: Major version is the first path segment under /api/public/ (e.g. /api/public/v3).
