                    US'
                  due_date: '2024-09-18T07:00:00.000Z'
                  purchase_order_number: 'Service Level: AEXC'
                  cancelled_at: null
        '401':
          description: Authentication token is not authorized to complete the request.
          content:
            application/json:
              example:
                error: Unauthorized
        '403':
          description: Invoice polling is not configured
          content:
            application/json:
              example:
                error: Invoice polling is not configured for this company. Please contact your Account Manager to enable this feature.
        '404':
          description: The order could not be found. Please check the id and try again.
          content:
            application/json:
              example:
                error: Not Found
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              example:
                error: Unprocessable Entity
    servers:
    - url: https://{environment}.airspace.com/api/public/v2
      variables:
        environment:
          default: apitest
