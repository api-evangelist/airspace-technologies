openapi: 3.2.0
info:
  title: Airspace Technologies Invoices API
  x-logo:
    url: https://www.airspacetechnologies.com/hubfs/Updated%20logos/Airspace%20horizontal%20logotype%20black%20and%20green%20no%20background%20011321%20(1).png
  version: '1.0'
  description: 'Operations tagged Invoices across 2 of this provider''s published API definitions: airspace-technologies-v2-openapi.json, airspace-technologies-v3-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{environment}.airspace.com/api/public/v2
  variables:
    environment:
      default: apitest
      enum:
      - api
      - apitest
- url: https://{environment}.airspace.com/api/public/v3
  variables:
    environment:
      default: apitest
      enum:
      - api
      - apitest
tags:
- name: Invoices
  description: We support listing invoices for Orders. Please reach out to account manager for setup
paths:
  /invoices:
    get:
      summary: List Invoices
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
        description: Desired page number
      - name: page_limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 25
          default: 10
        description: Amount of invoices to include in each page
      - name: from_created_at
        in: query
        schema:
          type: string
          example: '2021-04-14 13:30:00'
          description: If provided, this will filter for invoices where the created_at is greater than or equal the provided value.
      - name: to_created_at
        in: query
        schema:
          type: string
          example: '2022-04-14 13:30:00'
          description: If provided, this will filter for invoices where the created_at is less than or equal the provided value.
      - name: order[from_created_at]
        in: query
        schema:
          type: string
          example: '2021-04-14 13:30:00'
          description: If provided, this will filter for invoices whoes orders where the created_at is greater than or equal the provided value.
      - name: order[to_created_at]
        in: query
        schema:
          type: string
          example: '2022-04-14 13:30:00'
          description: If provided, this will filter for invoices whoes orders where the created_at is less than or equal the provided value.
      - name: order[references][reference]
        in: query
        schema:
          type: string
          example: test reference
          description: Filter by order reference
      - name: order[references][context]
        in: query
        schema:
          type: string
          example: test context
          description: Filter by order context
      - name: order[pieces][barcode]
        in: query
        schema:
          type: string
          example: '1122334455'
          description: Filter by piece barcode
      - name: order[pieces][barcode_type]
        in: query
        schema:
          type: string
          example: barcode_type_123
          description: Filter by piece barcode_type
      - name: order[pieces][commodity]
        in: query
        schema:
          type: string
          example: misc parts
          description: Filter by piece commodity
      - name: order[has_dangerous_goods]
        in: query
        schema:
          type: boolean
          example: 'true'
          description: Filter by order has_dangerous_goods value
      - name: order[should_hold_at_airlines]
        in: query
        schema:
          type: boolean
          example: 'true'
          description: Filter by order should_hold_at_airlines value
      - name: order[service_type]
        in: query
        schema:
          type: string
          example: optimize_for_time
          enum:
          - recommended
          - optimize_for_time
          - optimize_for_cost
          - drive_only
          - optimize_for_green
          description: Filter by order service_type value
      security:
      - Bearer: []
      tags:
      - Invoices
      operationId: getInvoices
      description: Get a list of Invoices
      responses:
        '200':
          description: Get a list of invoices
          content:
            application/json:
              example:
                invoices:
                - order_id: 72
                  tracking_id: ATYFGD4P4J
                  company_id: 236
                  company_name: Space Air Inc.
                  pickup_address:
                    company_name: PickupsRUs
                    street: 509 8th Street Southeast
                    street2: Apt. 1
                    street3: null
                    city: Orange City
                    state: IA
                    zip: '51041'
                    country: US
                  pickup_time: null
                  delivery_address:
                    company_name: DeliveryCrew
                    street: 199 Bell Street
                    street2: Apt. 1
                    street3: null
                    city: Reno
                    state: NV
                    zip: '89503'
                    country: US
                  bill_to_address:
                    company_name: Test Company
                    street: 123 Test St
                    street2: Suite 100
                    street3: null
                    city: Test City
                    state: CA
                    zip: '12345'
                    country: US
                  pieces:
                  - length: 1.0
                    width: 1.0
                    height: 1.0
                    dimension_unit: in
                    weight: 1.0
                    weight_unit: lbs
                    commodity: Other - test
                  - length: 2.0
                    width: 2.0
                    height: 2.0
                    dimension_unit: in
                    weight: 2.0
                    weight_unit: lbs
                    commodity: Other - Other - other
                  references:
                  - reference: null
                    value: Ref123
                  - reference: null
                    value: Ref456
                  - reference: null
                    value: Ref789
                  total_weight: 20
                  total_weight_unit: kg
                  service_type_code: DDF
                  equipment_type: CHTR
                  total_amount: '970.05'
                  total_pieces: 2
                  vehicle_type: car
                  origin_airport: SAN
                  destination_airport: TUS
                  currency: null
                  proof_of_delivery:
                    name: Signature-46
                    department: Department-46
                    delivered_at: null
                  line_items:
                  - segment: pickup
                    description: Base
                    quantity: 2
                    quantity_unit: miles
                    rate: '52.70'
                    amount: '15.40'
                    edi_code: EDI1
                    equipment_type: CHT
                  airspace_remittance: 'Test Company

                    123 Test St

                    Suite 100

                    Test City, CA 12345

                    US'
                  due_date: '2024-09-18T07:00:00.000Z'
                  purchase_order_number: 'Service Level: AEXC'
                  cancelled_at: null
                pagination:
                  page: 1
                  total_pages: 1
                  page_limit: 2
                parameter_errors: {}
        '401':
          description: Authentication token is not authorized to complete the request.
          content:
            application/json:
              example:
                error: Unauthorized
        '403':
          description: Invoice polling is not configured
          content:
            application/json:
              example:
                error: Invoice polling is not configured for this company. Please contact your Account Manager to enable this feature.
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              example:
                errors: Integration::Api::Public::V2::OrderFilterService::FilterError
    servers:
    - url: https://{environment}.airspace.com/api/public/v2
      variables:
        environment:
          default: apitest
          enum:
          - api
          - apitest
  /invoices/{tracking_id}:
    parameters:
    - name: tracking_id
      in: path
      description: Tracking ID or Order Number of an order
      required: true
      schema:
        type: string
    get:
      summary: Retrieve an Invoice
      parameters:
      - name: tracking_id
        in: path
        description: Tracking ID or Order Number of an order
        required: true
        schema:
          type: string
      security:
      - Bearer: []
      tags:
      - Invoices
      operationId: getInvoiceById
      description: Returns invoice object
      responses:
        '200':
          description: Returns a Invoice
          content:
            application/json:
              example:
                invoice:
                  order_id: 72
                  tracking_id: ATYFGD4P4J
                  company_id: 256
                  company_name: Space Air Inc.
                  pickup_address:
