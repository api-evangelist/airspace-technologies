                  - reference: null
                    value: Ref789
                  total_weight: 20
                  total_weight_unit: kg
                  service_type_code: DDF
                  equipment_type: CHTR
                  total_amount: '970.05'
                  total_pieces: 2
                  vehicle_type: car
                  origin_airport: SAN
                  destination_airport: TUS
                  currency: null
                  proof_of_delivery:
                    name: Signature-50
                    department: Department-50
                    delivered_at: null
                  line_items:
                  - segment: pickup
                    description: Base
                    quantity: 2
                    quantity_unit: miles
                    rate: '52.70'
                    amount: '15.40'
