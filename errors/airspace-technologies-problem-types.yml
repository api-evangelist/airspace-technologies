# Asynchronous shipment problem codes delivered via webhook `events[].problem.code`
# (delay and cancellation events). These are operational, not HTTP-status, errors.
shipment_problem_codes:
  delivered_via: webhook events[].problem.code
  codes:
  - code: 2-001
    meaning: Changed shipment parameters
  - code: 2-007
    meaning: Nothing to Pick Up or Shipment Not Ready / Uncontrollable delay at pickup
  note: >-
    Airspace publishes these two codes in the webhook documentation examples; the full
    problem-code registry is provided by Airspace to integrators and is not enumerated
